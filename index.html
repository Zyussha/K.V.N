<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>For You ❤️</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #ff758c, #ff7eb3);
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }

        .container {
            text-align: center;
            color: white;
            z-index: 10;
        }

        /* LOVE UTAMA */
        .heart {
            position: relative;
            width: 120px;
            height: 120px;
            margin: auto;
            transform: rotate(-45deg);
            background: #ff1744;
            animation: heartbeat 1s infinite;
            box-shadow:
                0 0 30px #ff1744,
                0 0 60px rgba(255, 23, 68, 0.6);
        }

        .heart::before,
        .heart::after {
            content: "";
            position: absolute;
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: #ff1744;
        }

        .heart::before {
            top: -60px;
            left: 0;
        }

        .heart::after {
            left: 60px;
            top: 0;
        }

        @keyframes heartbeat {
            0%, 100% {
                transform: rotate(-45deg) scale(1);
            }

            25% {
                transform: rotate(-45deg) scale(1.1);
            }

            40% {
                transform: rotate(-45deg) scale(1);
            }

            60% {
                transform: rotate(-45deg) scale(1.15);
            }
        }

        /* TEKS */
        h1 {
            margin-top: 90px;
            font-size: 42px;
            text-shadow: 0 0 15px rgba(255,255,255,0.8);
            animation: fadeIn 2s ease;
        }

        p {
            margin-top: 15px;
            font-size: 20px;
            animation: fadeIn 3s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* LOVE BERJATUHAN */
        .floating-heart {
            position: absolute;
            bottom: -50px;
            font-size: 25px;
            animation: floatUp linear infinite;
            opacity: 0.8;
        }

        @keyframes floatUp {
            from {
                transform: translateY(0) rotate(0deg);
                opacity: 0;
            }

            20% {
                opacity: 1;
            }

            to {
                transform: translateY(-110vh) rotate(360deg);
                opacity: 0;
            }
        }

        /* TOMBOL */
        button {
            margin-top: 30px;
            padding: 12px 28px;
            border: none;
            border-radius: 30px;
            background: white;
            color: #ff1744;
            font-size: 18px;
            cursor: pointer;
            transition: 0.3s;
            box-shadow: 0 5px 20px rgba(0,0,0,0.2);
        }

        button:hover {
            transform: scale(1.1);
        }

        /* PESAN */
        #message {
            margin-top: 20px;
            font-size: 22px;
            display: none;
            animation: fadeIn 1s ease;
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="heart"></div>

        <h1>I Love You ❤️</h1>

        <p>Untuk seseorang yang spesial 💕</p>

        <button onclick="showMessage()">
            Klik Aku 💌
        </button>

        <div id="message">
            Kamu adalah alasan senyumku setiap hari. ❤️
        </div>

    </div>

    <script>

        // Membuat love yang beterbangan
        function createHeart() {

            const heart = document.createElement("div");

            heart.classList.add("floating-heart");

            heart.innerHTML = "❤️";

            heart.style.left =
                Math.random() * 100 + "vw";

            heart.style.fontSize =
                (15 + Math.random() * 30) + "px";

            heart.style.animationDuration =
                (4 + Math.random() * 5) + "s";

            document.body.appendChild(heart);

            setTimeout(() => {
                heart.remove();
            }, 9000);
        }

        // Love muncul terus
        setInterval(createHeart, 300);


        // Tombol pesan
        function showMessage() {

            const message =
                document.getElementById("message");

            message.style.display = "block";

            // Tambahkan banyak love
            for (let i = 0; i < 20; i++) {
                setTimeout(createHeart, i * 100);
            }
        }

    </script>

</body>
</html>
